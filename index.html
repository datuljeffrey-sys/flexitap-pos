<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexiTap — Next Gen POS System</title>
  
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; }
    
    /* Header Navbar */
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #1e293b; }
    .logo { font-size: 24px; font-weight: 800; color: #3b82f6; letter-spacing: -0.5px; }
    .nav-btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .nav-btn:hover { background: #1d4ed8; }

    /* Hero Section */
    .hero { text-align: center; padding: 100px 20px; max-width: 800px; margin: 0 auto; }
    .hero h1 { font-size: 48px; font-weight: 800; margin-bottom: 16px; line-height: 1.2; }
    .hero p { font-size: 18px; color: #94a3b8; margin-bottom: 32px; }

    /* Modal Styling */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: #1e293b; border: 1px solid #334155; padding: 32px; border-radius: 16px; width: 100%; max-width: 420px; position: relative; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
    .modal-card h2 { margin-top: 0; font-size: 22px; }
    .modal-card p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; margin-bottom: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 15px; }
    input:focus { outline: none; border-color: #3b82f6; }
    .submit-btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 16px; }
    .submit-btn:hover { background: #1d4ed8; }
    .error-msg { color: #f87171; font-size: 14px; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">FlexiTap POS</div>
    <button class="nav-btn" onclick="openModal()">Store Owner Login</button>
  </header>

  <!-- HERO SECTION -->
  <main class="hero">
    <h1>All-in-One Cloud POS & Analytics Dashboard</h1>
    <p>Manage sales, inventory, and receipts directly from your mobile register or access your real-time analytics portal anywhere.</p>
    <button class="nav-btn" style="padding: 14px 28px; font-size: 18px;" onclick="openModal()">Open Customer Portal</button>
  </main>

  <!-- LOGIN MODAL -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2>Store Owner Web Portal</h2>
      <p>Log in with your POS account credentials to view live reports.</p>

      <form id="portal-login-form">
        <label for="modal-email">Owner Email Address</label>
        <input type="email" id="modal-email" required placeholder="merchant@example.com" />

        <label for="modal-password">Password</label>
        <input type="password" id="modal-password" required placeholder="••••••••" />

        <button type="submit" class="submit-btn" id="login-btn-text">Log In to Portal</button>
      </form>
      <div id="modal-error" class="error-msg"></div>
    </div>
  </div>

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://ezaqdnnecfkmqjdzigrf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6YXFkbm5lY2ZrbXFqZHppZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAwMjgyODgsImV4cCI6MjA1NTYwNDI4OH0.M_J8yWdK_B7t7xH3ZtD5C9l5tq8t8-w6Z2lQ6v5mUQI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Modal UI Controls
    function openModal() { document.getElementById('login-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('login-modal').style.display = 'none'; }

    // Auto Check if already logged in
    async function checkExistingSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        // User is already authenticated! Redirect directly to portal
        window.location.href = 'portal.html';
      }
    }

    // Login Form Handler
    document.getElementById('portal-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('modal-email').value.trim();
      const password = document.getElementById('modal-password').value;
      const errorDiv = document.getElementById('modal-error');
      const btnText = document.getElementById('login-btn-text');

      errorDiv.innerText = '';
      btnText.innerText = 'Authenticating...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) throw error;

        // Success! Redirect straight to portal.html without page reload interruptions
        window.location.href = 'portal.html';

      } catch (err) {
        errorDiv.innerText = err.message || 'Failed to authenticate.';
        btnText.innerText = 'Log In to Portal';
      }
    });

    checkExistingSession();
  </script>
</body>
</html>

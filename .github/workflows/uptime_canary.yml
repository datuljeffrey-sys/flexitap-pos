name: Synthetic Uptime Canary Probe

on:
  schedule:
    - cron: '*/15 * * * *' # Probes every 15 minutes
  workflow_dispatch:

jobs:
  uptime-check:
    name: Probe Production Endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Probe Web Portal Health Endpoint
        run: |
          echo "Probing Web Portal health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://flexitap.app/health.json || echo "000")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 301 ] && [ "$HTTP_STATUS" -ne 302 ]; then
            echo "::warning::Web Portal health endpoint returned $HTTP_STATUS"
          else
            echo "Web portal is healthy!"
          fi

    function applyDatePreset(preset, btnElement) {
      document.querySelectorAll('.preset-pill').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      const today = new Date();
      let start = new Date();
      let end = new Date();

      if (preset === 'today') {
        // Today
      } else if (preset === 'yesterday') {
        start.setDate(today.getDate() - 1);
        end.setDate(today.getDate() - 1);
      } else if (preset === '7days') {
        start.setDate(today.getDate() - 6);
      } else if (preset === 'month') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
      }

      document.getElementById('start-date').value = getLocalDateString(start);
      document.getElementById('end-date').value = getLocalDateString(end);
      requestOnDemandReport();
    }

    // --- ON-DEMAND REALTIME RELAY ENGINE ---
    let relayChannels = [];
    let currentPendingRequestId = null;

    function initReportRelay() {
      if (relayChannels.length > 0) return;

      const channelNames = [
        `store_reports_relay_${activeStore?.id}`,
        `store_reports_relay_${activeUser?.id}`,
        'store_reports_relay_a927b91f-0c1a-47b7-bf8b-59a9764aeacd'
      ].filter(Boolean);

      channelNames.forEach(chName => {
        const ch = supabaseClient.channel(chName, {
          config: { broadcast: { self: false } }
        });

        ch.on('broadcast', { event: 'REPORT_RESPONSE' }, (payload) => {
          handleRelayResponse(payload.payload);
        }).subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            const badge = document.querySelector('.status-badge');
            if (badge) badge.innerText = '● Live POS Relay';
          }
        });

        relayChannels.push(ch);
      });
    }

    function requestOnDemandReport() {
      const btn = document.getElementById('btn-run-report');
      const icon = document.getElementById('run-report-icon');
      const text = document.getElementById('run-report-text');

      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.75';
      }
      if (icon) icon.innerText = '⏳';
      if (text) text.innerText = 'Running...';

      const s = document.getElementById('start-date')?.value || getLocalDateString();
      const e = document.getElementById('end-date')?.value || getLocalDateString();

      const banner = document.getElementById('global-audit-banner');
      const bannerText = document.getElementById('audit-banner-text');
      if (banner) banner.className = 'audit-notice-banner balanced';
      if (bannerText) bannerText.innerText = '📡 Pulling live report data on demand from POS terminal (flexitap.db)...';

      const reqId = 'req_' + Date.now();
      currentPendingRequestId = reqId;

      relayChannels.forEach(ch => {
        if (ch && ch.state === 'joined') {
          ch.send({
            type: 'broadcast',
            event: 'RUN_REPORT',
            payload: {
              requestId: reqId,
              report: activeReportId,
              startDate: s,
              endDate: e
            }
          });
        }
      });

      fetchAndRenderAllReports(s, e);

      setTimeout(() => {
        if (currentPendingRequestId === reqId) {
          currentPendingRequestId = null;
          resetRunButton();
        }
      }, 5000);
    }

    function resetRunButton() {
      const btn = document.getElementById('btn-run-report');
      const icon = document.getElementById('run-report-icon');
      const text = document.getElementById('run-report-text');
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
      if (icon) icon.innerText = '▶';
      if (text) text.innerText = 'Run Report';
    }

        taxes: Number(d.total_taxes || 0),
        tips: Number(d.tips || 0),

        txnCount: Number(d.transactions || 0),
        openingBank: Number(d.opening_bank || 0),
        cashSales: Number(d.payment_breakdown?.Cash || d.payment_breakdown?.CASH || 0),
        paidIn: Number(d.paid_in || 0),
        paidOut: Number(d.paid_out || 0),
        expectedCash: Number(d.expected_cash || (d.payment_breakdown?.Cash || 0)),
        payments: d.payment_breakdown || {},
        categories: d.category_breakdown || {},
        hourly: d.hourly_sales || {},
        terminalSales: d.terminal_sales || [],
        productMix: d.product_mix || [],
        laborSummary: d.labor_summary || [],
        inventorySnapshot: d.inventory_snapshot || [],
        auditExceptions: d.audit_exceptions || [],
        customersCrm: d.customers_crm || [],
        recentChecks: d.recent_checks || [],
        discountsSummary: d.discounts_summary || [],
        giftCardsSummary: d.gift_cards_summary || [],
        loyaltySummary: d.loyalty_summary || {},
        arLedgerSummary: d.ar_ledger_summary || [],
        recipeCogsSummary: d.recipe_cogs_summary || [],

        drawerLedgerSummary: d.drawer_ledger_summary || [],
        wasteLossSummary: d.waste_loss_summary || [],
        activityClickstream: d.activity_clickstream || []
      };

      if (resp.storeName) {
        const storeDisp = document.getElementById('store-name-display');
        const zreadDisp = document.getElementById('zread-store-name');
        if (storeDisp) storeDisp.innerText = resp.storeName;
        if (zreadDisp) zreadDisp.innerText = resp.storeName;
      }
      if (resp.currency && activeStore) {
        activeStore.currency_symbol = resp.currency === 'PHP' ? '₱' : '$';
      }

      renderAllViews();

      const banner = document.getElementById('global-audit-banner');
      const bannerText = document.getElementById('audit-banner-text');
      if (banner) banner.className = 'audit-notice-banner balanced';
      if (bannerText) bannerText.innerText = '✓ Live report data pulled on demand from local POS terminal (flexitap.db).';

    // --- DATA AGGREGATOR & REPORT ENGINE ---
    async function fetchAndRenderAllReports(startDate, endDate) {
      try {
        let query = supabaseClient
          .from('daily_sales_summaries')
          .select('*')
          .gte('date', startDate)
          .lte('date', endDate);

        if (activeStore?.id) {
          query = query.or(`store_id.eq.${activeStore.id},store_id.eq.a927b91f-0c1a-47b7-bf8b-59a9764aeacd`);
        }

        const { data: summaries, error: sumErr } = await query;
        if (sumErr) {
          console.warn('Error querying summaries:', sumErr);
        }

        let gross = 0, net = 0, tax = 0, tips = 0, discounts = 0, refunds = 0;
        let txns = 0, voidsCount = 0, voidsAmount = 0;
        let payments = {}, categories = {};
        let liveTerminalSales = [];
        let liveProductMix = [];
        let liveLaborSummary = [];
        let liveInventory = [];
        let liveExceptions = [];
        let liveCustomers = [];
        let liveChecks = [];
        let liveDiscounts = [];
        let liveGiftCards = [];
        let liveLoyalty = {};
        let liveArLedger = [];
        let liveRecipeCogs = [];
        let liveExpiring = [];
        let liveDrawer = [];
        let liveWaste = [];
        let liveActivity = [];

        if (summaries && summaries.length > 0) {
          summaries.forEach(row => {
            gross += Number(row.gross_sales || row.net_sales || 0);
            net += Number(row.net_sales || 0);
            tax += Number(row.total_taxes || row.total_tax || 0);
            tips += Number(row.tips || 0);
            discounts += Number(row.total_discounts || 0);
            refunds += Number(row.total_refunds || 0);
            txns += Number(row.transactions || 0);
            voidsCount += Number(row.voided_count || 0);
            voidsAmount += Number(row.voided_amount || 0);

            const pb = row.payment_breakdown || {};
            for (let k in pb) {
              const val = typeof pb[k] === 'number' ? pb[k] : (pb[k].total_sales || pb[k].sale_amt || 0);
              payments[k] = (payments[k] || 0) + val;
            }

            const cb = row.category_breakdown || {};
            for (let k in cb) {
              const netVal = typeof cb[k] === 'number' ? cb[k] : (cb[k].net_sales || cb[k].net || 0);
              const countVal = cb[k].item_count || cb[k].units || 1;
              if (!categories[k]) categories[k] = { net: 0, count: 0 };
              categories[k].net += netVal;
              categories[k].count += countVal;
            }

            if (Array.isArray(row.terminal_sales) && row.terminal_sales.length > 0) liveTerminalSales = row.terminal_sales;
            if (Array.isArray(row.product_mix) && row.product_mix.length > 0) liveProductMix = row.product_mix;
            if (Array.isArray(row.labor_summary) && row.labor_summary.length > 0) liveLaborSummary = row.labor_summary;
            if (Array.isArray(row.inventory_snapshot) && row.inventory_snapshot.length > 0) liveInventory = row.inventory_snapshot;
            if (Array.isArray(row.audit_exceptions) && row.audit_exceptions.length > 0) liveExceptions = row.audit_exceptions;
            if (Array.isArray(row.customers_crm) && row.customers_crm.length > 0) liveCustomers = row.customers_crm;
            if (Array.isArray(row.recent_checks) && row.recent_checks.length > 0) liveChecks = row.recent_checks;
            if (Array.isArray(row.discounts_summary) && row.discounts_summary.length > 0) liveDiscounts = row.discounts_summary;
            if (Array.isArray(row.gift_cards_summary) && row.gift_cards_summary.length > 0) liveGiftCards = row.gift_cards_summary;
            if (row.loyalty_summary && typeof row.loyalty_summary === 'object') liveLoyalty = row.loyalty_summary;
            if (Array.isArray(row.ar_ledger_summary) && row.ar_ledger_summary.length > 0) liveArLedger = row.ar_ledger_summary;
            if (Array.isArray(row.recipe_cogs_summary) && row.recipe_cogs_summary.length > 0) liveRecipeCogs = row.recipe_cogs_summary;
            if (Array.isArray(row.expiring_batches) && row.expiring_batches.length > 0) liveExpiring = row.expiring_batches;
            if (Array.isArray(row.drawer_ledger_summary) && row.drawer_ledger_summary.length > 0) liveDrawer = row.drawer_ledger_summary;
            if (Array.isArray(row.waste_loss_summary) && row.waste_loss_summary.length > 0) liveWaste = row.waste_loss_summary;
            if (Array.isArray(row.activity_clickstream) && row.activity_clickstream.length > 0) liveActivity = row.activity_clickstream;
          });
        }

        const cashSales = payments['Cash'] || payments['CASH'] || 0;
        const openingBank = 0;
        const paidIn = 0;
        const paidOut = 0;
        const expectedCash = openingBank + cashSales + paidIn - paidOut;

        currentAgg = {
          grossSales: gross, netSales: net, taxes: tax, tips: tips, discounts: discounts,
          refunds: refunds, voidsCount: voidsCount, voidsAmount: voidsAmount,
          txnCount: txns, openingBank: openingBank, cashSales: cashSales,
          paidIn: paidIn, paidOut: paidOut, expectedCash: expectedCash,
          payments: payments, categories: categories,
          terminalSales: liveTerminalSales,
          productMix: liveProductMix,
          laborSummary: liveLaborSummary,
          inventorySnapshot: liveInventory,
          auditExceptions: liveExceptions,
          customersCrm: liveCustomers,
          recentChecks: liveChecks,
          discountsSummary: liveDiscounts,
          giftCardsSummary: liveGiftCards,
          loyaltySummary: liveLoyalty,
          arLedgerSummary: liveArLedger,
          recipeCogsSummary: liveRecipeCogs,
          expiringBatches: liveExpiring,
          drawerLedgerSummary: liveDrawer,
          wasteLossSummary: liveWaste,
          activityClickstream: liveActivity
        };

        renderAllViews();
      } catch (err) {
        console.error('Error fetching reports data:', err);
      }
    }

    // --- 1. SALES SUMMARY RENDERER ---
    function renderSalesSummary() {
      const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
      setTxt('sum-gross', formatMoney(currentAgg.grossSales));
      setTxt('sum-disc', `-${formatMoney(currentAgg.discounts)}`);
      setTxt('sum-net', formatMoney(currentAgg.netSales));
      setTxt('sum-tax', formatMoney(currentAgg.taxes));
      setTxt('sum-tips', formatMoney(currentAgg.tips));
      setTxt('sum-total-accountable', formatMoney(currentAgg.netSales + currentAgg.taxes + currentAgg.tips));
      setTxt('sum-txns', currentAgg.txnCount);
      const avg = currentAgg.txnCount > 0 ? (currentAgg.netSales / currentAgg.txnCount) : 0;
      setTxt('sum-avg-chk', formatMoney(avg));

      setTxt('sum-bank', formatMoney(currentAgg.openingBank));
      setTxt('sum-cash-sales', formatMoney(currentAgg.cashSales));
      setTxt('sum-paid-in', `+${formatMoney(currentAgg.paidIn)}`);
      setTxt('sum-paid-out', `-${formatMoney(currentAgg.paidOut)}`);
      setTxt('sum-expected-cash', formatMoney(currentAgg.expectedCash));

      setTxt('sum-voids-count', currentAgg.voidsCount);
      setTxt('sum-voids-amount', formatMoney(currentAgg.voidsAmount));
      setTxt('sum-refunds-count', 0);
      setTxt('sum-refunds-amount', formatMoney(currentAgg.refunds));

      const accBody = document.getElementById('summary-accountability-tbody');
      if (accBody) {
        accBody.innerHTML = `
          <tr><td>Gross Sales</td><td class="num">${formatMoney(currentAgg.grossSales)}</td></tr>
          <tr><td>- Discounts & Coupons</td><td class="num" style="color:#dc2626;">-${formatMoney(currentAgg.discounts)}</td></tr>
          <tr style="font-weight:700;"><td>= Net Sales</td><td class="num" style="color:#16a34a;">${formatMoney(currentAgg.netSales)}</td></tr>
          <tr><td>+ Tax (VAT & Local)</td><td class="num">${formatMoney(currentAgg.taxes)}</td></tr>
          <tr><td>+ Tips Recorded</td><td class="num">${formatMoney(currentAgg.tips)}</td></tr>
          <tr class="total-row"><td>Total Accountable Liability</td><td class="num">${formatMoney(currentAgg.netSales + currentAgg.taxes + currentAgg.tips)}</td></tr>
        `;
      }

      let mHtml = '';
      let mTotal = 0;
      for (let k in currentAgg.payments) {
        const val = currentAgg.payments[k];
        mTotal += val;
        mHtml += `<tr><td><strong>${k}</strong></td><td class="num">${formatMoney(val)}</td><td class="num">${formatMoney(k.includes('Card') ? currentAgg.tips : 0)}</td><td class="num">${formatMoney(val + (k.includes('Card') ? currentAgg.tips : 0))}</td></tr>`;
      }
      const mediaBody = document.getElementById('summary-media-tbody');
      if (mediaBody) {
        if (mHtml === '') {
          mediaBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 24px; color: var(--text-muted);">No payment transactions recorded for this period.</td></tr>';
        } else {
          mHtml += `<tr class="total-row"><td>Total Tendered Media</td><td class="num" colspan="3">${formatMoney(mTotal + currentAgg.tips)}</td></tr>`;
          mediaBody.innerHTML = mHtml;
        }
      }

      const totalLiabilities = currentAgg.netSales + currentAgg.taxes + currentAgg.tips;
      const variance = Math.abs(mTotal + currentAgg.tips - totalLiabilities);
      const isBalanced = variance < 0.05;
      const banner = document.getElementById('global-audit-banner');
      const bannerText = document.getElementById('audit-banner-text');
      if (banner) banner.className = `audit-notice-banner ${isBalanced ? 'balanced' : 'unbalanced'}`;
      if (bannerText) {
        bannerText.innerText = isBalanced
          ? 'Audit Verification: Complete mathematical symmetry between recorded settlement media and accountable liabilities.'
          : `Ledger Audit Notice: Tendered settlement media (${formatMoney(mTotal + currentAgg.tips)}) differs by ${formatMoney(variance)} from recorded liabilities (${formatMoney(totalLiabilities)}).`;
      }
    }

    // --- 3. TERMINAL SALES ---
    function renderTerminalSales() {
      const tbody = document.getElementById('terminal-sales-tbody');
      if (!tbody) return;
      if (currentAgg.terminalSales && currentAgg.terminalSales.length > 0) {
        let html = '';
        let totalSales = 0;
        let totalTxns = 0;
        currentAgg.terminalSales.forEach(t => {
          const sales = Number(t.total_sales || t.sales || 0);
          const txns = Number(t.txn_count || t.transactions || 0);
          const cash = Number(t.cash_tendered || t.cash || (sales * 0.4));
          const card = sales - cash;
          const share = currentAgg.grossSales > 0 ? ((sales / currentAgg.grossSales) * 100).toFixed(1) : '0.0';
          totalSales += sales;
          totalTxns += txns;

          html += `
            <tr>
              <td><strong>${t.device_name || t.name || 'Terminal'}</strong></td>
              <td><span class="badge-status ${t.role === 'master' ? 'healthy' : 'info'}">${(t.role || 'STATION').toUpperCase()}</span></td>
              <td class="num">${txns}</td>
              <td class="num">${formatMoney(cash)}</td>
              <td class="num">${formatMoney(card)}</td>
              <td class="num">${formatMoney(sales)}</td>
              <td class="num">${share}%</td>
            </tr>
          `;
        });
        html += `
          <tr class="total-row">
            <td>Total All Terminals</td>
            <td></td>
            <td class="num">${totalTxns || currentAgg.txnCount}</td>
            <td class="num">${formatMoney(currentAgg.cashSales)}</td>

            <td class="num">${formatMoney(totalSales || currentAgg.grossSales)}</td>

    }

    // --- 4. PRODUCT MIX ---
    function renderProductMix() {
      const tbody = document.getElementById('pmix-tbody');
      if (!tbody) return;
      if (currentAgg.productMix && currentAgg.productMix.length > 0) {
        const pmixItems = currentAgg.productMix.map(p => {
          const qty = Number(p.quantitySold || p.quantity || 1);
          const net = Number(p.netSales || p.sales || 0);
          const price = qty > 0 ? (net / qty) : 0;
          const cogs = price * 0.28;
          return {
            name: p.itemName || p.name || 'Item',
            cat: p.categoryName || 'General',
            qty: qty,
            price: price,
            cogs: cogs,
            tag: qty > 10 ? 'STAR ⭐' : (price > 100 ? 'PUZZLE 🧩' : 'PLOWHORSE 🐎'),
            cls: qty > 10 ? 'star' : (price > 100 ? 'warning' : 'info')
          };
        });

        const topItemEl = document.getElementById('pmix-top-item');
        const unitsEl = document.getElementById('pmix-total-units');
        if (topItemEl) topItemEl.innerText = pmixItems[0]?.name || '-';
        const totalUnits = pmixItems.reduce((acc, i) => acc + i.qty, 0);
        if (unitsEl) unitsEl.innerText = totalUnits;

        let html = '';
        pmixItems.forEach(i => {
          const net = i.qty * i.price;
          const totalCost = i.qty * i.cogs;
          const marginPct = net > 0 ? ((net - totalCost) / net * 100).toFixed(1) : '0.0';
          html += `
            <tr>
              <td><strong>${i.name}</strong></td>
              <td>${i.cat}</td>
              <td class="num">${i.qty}</td>
              <td class="num">${formatMoney(i.price)}</td>
              <td class="num">${formatMoney(net)}</td>
              <td class="num">${formatMoney(totalCost)}</td>
              <td class="num" style="color:#16a34a; font-weight:700;">${marginPct}%</td>
              <td><span class="badge-status ${i.cls}">${i.tag}</span></td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
        return;
      }
      const topItemEl = document.getElementById('pmix-top-item');
      const unitsEl = document.getElementById('pmix-total-units');
      if (topItemEl) topItemEl.innerText = 'None';
      if (unitsEl) unitsEl.innerText = '0';
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 40px; color: var(--text-muted);">No products sold during this period.</td></tr>';
    }

      const pctEl = document.getElementById('labor-pct-sales');

      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 40px; color: var(--text-muted);">No staff shift hours recorded for this date range.</td></tr>';

    // --- 8. INVENTORY REPORT ---
    function renderInventoryReport() {
      const tbody = document.getElementById('inventory-tbody');
      if (!tbody) return;
      if (currentAgg.inventorySnapshot && currentAgg.inventorySnapshot.length > 0) {
        let html = '';
        currentAgg.inventorySnapshot.forEach(i => {
          const stock = Number(i.currentStock || 0);
          const par = Number(i.reorderPoint || 10);
          let status = 'healthy';

          else if (stock <= par) { status = 'warning'; label = 'LOW STOCK'; }
          const cost = Number(i.costPrice || (i.price ? i.price * 0.4 : 50));
          const val = stock * cost;

          html += `
            <tr>
              <td><code>${i.sku || 'SKU'}</code></td>

              <td>${i.categoryName || 'General'}</td>

              <td class="num">${par}</td>
              <td class="num">${formatMoney(cost)}</td>
              <td class="num" style="font-weight:700;">${formatMoney(val)}</td>
              <td><span class="badge-status ${status}">${label}</span></td>
            </tr>

              <td><span class="badge-status ${statusCls}">${statusLabel}</span></td>

    function selectReceipt(id) {
      const c = mockChecks.find(item => item.id == id) || mockChecks[0];
      if (!c) return;
      const rcptStore = document.getElementById('rcpt-store');
      const rcptMeta = document.getElementById('rcpt-meta');
      const rcptDate = document.getElementById('rcpt-date');
      const rcptItems = document.getElementById('rcpt-items');
      const rcptSub = document.getElementById('rcpt-subtotal');
      const rcptTax = document.getElementById('rcpt-tax');
      const rcptTips = document.getElementById('rcpt-tips');
      const rcptTotal = document.getElementById('rcpt-total');
      const rcptTender = document.getElementById('rcpt-tender');

      if (rcptStore) rcptStore.innerText = (activeStore?.name || 'FLEXITAP POS').toUpperCase();
      if (rcptMeta) rcptMeta.innerText = `CHECK #${c.id} • ${c.table} • ${c.cashier}`;
      if (rcptDate) rcptDate.innerText = c.time || '';
      
      let itemRows = '';
      (c.items || []).forEach(i => {
        itemRows += `<tr><td>${i.qty}x ${i.name}</td><td style="text-align:right;">${formatMoney(i.price * i.qty)}</td></tr>`;
      });
      if (rcptItems) rcptItems.innerHTML = itemRows;
      if (rcptSub) rcptSub.innerText = formatMoney(c.sub);
      if (rcptTax) rcptTax.innerText = formatMoney(c.tax);
      if (rcptTips) rcptTips.innerText = formatMoney(c.tip);
      if (rcptTotal) rcptTotal.innerText = formatMoney(c.total + c.tip);
      if (rcptTender) rcptTender.innerText = `SETTLED VIA ${c.tender}`;
    }

    // --- CSV EXPORT ENGINE ---
    function exportActiveTableToCSV() {
      const activeTab = document.querySelector('.tab-content.active');
      if (!activeTab) return;

      const table = activeTab.querySelector('.data-table');
      if (!table) {
        alert('No data table found in this report.');
        return;
      }

      let csv = [];
      const rows = table.querySelectorAll('tr');
      rows.forEach(row => {
        if (row.style.display === 'none') return;
        let cols = [];
        row.querySelectorAll('th, td').forEach(col => {
          let text = col.innerText.replace(/"/g, '""').trim();
          cols.push(`"${text}"`);
        });
        csv.push(cols.join(','));
      });

      const csvContent = "data:text/csv;charset=utf-8," + csv.join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      const dateStr = document.getElementById('start-date')?.value || 'export';
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `FlexiTap_${activeReportId}_${dateStr}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // --- PDF EXPORT ENGINE ---
    function exportReportToPDF() {
      const area = document.getElementById('report-export-area');
      const filename = `FlexiTap_${activeReportId}_${document.getElementById('start-date')?.value || 'report'}.pdf`;

      html2pdf().set({
        margin: [0.3, 0.3],
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#f8fafc' },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
      }).from(area).save();
    }

    // --- AUTHENTICATION & SESSION HANDLING ---
    async function loadApp(user) {
      if (!user) return;
      activeUser = user;

      // 1. Immediately reveal the workspace so login UI doesn't hang
      const loginView = document.getElementById('login-view');
      const appLayout = document.getElementById('app-layout');
      if (loginView) loginView.style.display = 'none';
      if (appLayout) appLayout.style.display = 'flex';

      let store = null;
      let profile = null;

      try {
        const { data: storeData } = await supabaseClient
          .from('stores')
          .select('*')
          .or(`owner_id.eq.${user.id},user_id.eq.${user.id}`)
          .maybeSingle();
        store = storeData;
      } catch (err) {
        console.warn('Could not load store data:', err);
      }

      try {
        const { data: profileData } = await supabaseClient
          .from('profiles')
          .select('subscription_tier, role, store_name')
          .eq('id', user.id)
          .maybeSingle();
        profile = profileData;
      } catch (err) {
        console.warn('Could not load profile data:', err);
      }

      activeStore = store || {
        id: user.id,
        name: profile?.store_name || 'My Store',
        currency_symbol: '$'
      };

      const storeNameDisplay = document.getElementById('store-name-display');
      const storeTierDisplay = document.getElementById('store-tier-display');
      if (storeNameDisplay) storeNameDisplay.innerText = activeStore.name || 'My Store';
      if (storeTierDisplay) storeTierDisplay.innerText = (profile?.subscription_tier || 'Pro').toUpperCase() + ' EDITION';

      // 2. Safe setup for Remote Access without blocking the app[cite: 1]
      try {
        setupRemoteAccessGate(profile?.subscription_tier);[cite: 1]
        maybeAutoOpenSupportCode();[cite: 1]
      } catch (err) {
        console.warn('Remote access setup error:', err);
      }

      const today = getLocalDateString();
      const startDateInput = document.getElementById('start-date');
      const endDateInput = document.getElementById('end-date');
      if (startDateInput && !startDateInput.value) startDateInput.value = '2026-10-06';
      if (endDateInput && !endDateInput.value) endDateInput.value = today;

      try {
        initReportRelay();
      } catch (e) {
        console.warn('Relay init skipped:', e);
      }

      try {
        requestOnDemandReport();
      } catch (e) {
        console.warn('On-demand report query skipped:', e);
      }

      try {
        initMerchantSupportChat();
      } catch (e) {
        console.warn('Support chat skipped:', e);
      }
    }

    document.getElementById('portal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('p-email').value.trim();
      const password = document.getElementById('p-password').value;
      const btn = document.getElementById('p-btn');
      const err = document.getElementById('p-err');

      if (btn) btn.innerText = 'Signing In...';
      if (err) err.innerText = '';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          if (err) err.innerText = error.message;
          if (btn) btn.innerText = 'Sign In to Reports';
        } else if (data?.user) {
          await loadApp(data.user);
        }
      } catch (signInErr) {
        if (err) err.innerText = signInErr.message || 'Login failed';
        if (btn) btn.innerText = 'Sign In to Reports';
      }
    });

    async function logout() {
      try {
        await supabaseClient.auth.signOut();
      } catch (_) {}
      const appLayout = document.getElementById('app-layout');
      const loginView = document.getElementById('login-view');
      const passwordInput = document.getElementById('p-password');
      const btn = document.getElementById('p-btn');

      if (appLayout) appLayout.style.display = 'none';
      if (passwordInput) passwordInput.value = '';
      if (btn) btn.innerText = 'Sign In to Reports';
      if (loginView) loginView.style.display = 'flex';
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session?.user && (!activeUser || activeUser.id !== session.user.id)) {
        loadApp(session.user);
      }
    });

    // --- SUPPORT CHAT ---
    function toggleMerchantSupport() {
      const p = document.getElementById('merchant-chat-panel');
      if (p) {
        p.style.display = (p.style.display === 'none' || p.style.display === '') ? 'flex' : 'none';
      }
    }

    async function initMerchantSupportChat() {
      if (currentSupportSession || !activeUser) return;
      try {
        const { data: existing } = await supabaseClient
          .from('support_sessions')
          .select('*')
          .eq('merchant_user_id', activeUser.id)
          .eq('status', 'open')
          .order('created_at', { ascending: false })
          .limit(1);

        let session = existing && existing.length > 0 ? existing[0] : null;

        if (!session) {
          const { data: created } = await supabaseClient
            .from('support_sessions')
            .insert([{
              store_id: activeStore.id,
              store_name: activeStore.name || 'My Store',
              merchant_user_id: activeUser.id,
              merchant_email: activeUser.email
            }])
            .select()
            .single();
          session = created;
        }

        currentSupportSession = session;
        if (!session) return;

        const { data: msgs } = await supabaseClient
          .from('support_messages')
          .select('*')
          .eq('session_id', session.id)
          .order('created_at', { ascending: true });

        const box = document.getElementById('m-chat-messages');
        if (box && msgs && msgs.length > 0) {
          box.innerHTML = '';
          msgs.forEach(m => renderSupportBubble(m.sender_role, m.message, m.created_at));
        }

        if (currentChatChannel) {
          try { supabaseClient.removeChannel(currentChatChannel); } catch (_) {}
          currentChatChannel = null;
        }

        currentChatChannel = supabaseClient.channel(`chat-${session.id}`);
        currentChatChannel.on('postgres_changes', {
          event: 'INSERT', schema: 'public', table: 'support_messages', filter: `session_id=eq.${session.id}`
        }, (payload) => {
          if (payload.new && payload.new.sender_role === 'agent') {
            renderSupportBubble('agent', payload.new.message, payload.new.created_at);
          }
        }).subscribe();
      } catch (e) {
        console.warn('Support chat initialization note:', e);
      }
    }

    function renderSupportBubble(role, message, timestamp) {
      const box = document.getElementById('m-chat-messages');
      if (!box) return;
      const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const div = document.createElement('div');
      div.className = `bubble ${role === 'merchant' ? 'bubble-merchant' : 'bubble-agent'}`;
      div.innerHTML = `${message} <div style="font-size:9.5px; opacity:0.6; margin-top:3px; text-align:right;">${role === 'merchant' ? 'You' : 'Tech Support'} • ${timeStr}</div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function sendMerchantMessage(event) {
      event.preventDefault();
      const input = document.getElementById('m-chat-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text || !currentSupportSession) return;

      input.value = '';
      renderSupportBubble('merchant', text, new Date());

      try {
        await supabaseClient.from('support_messages').insert([{
          session_id: currentSupportSession.id,
          sender_id: activeUser.id,
          sender_role: 'merchant',
          message: text
        }]);
      } catch (err) {
        console.error('Error sending support message:', err);
      }
    }

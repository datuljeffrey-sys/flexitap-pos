<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexiTap — Customer Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    body { padding: 24px; background: var(--bg); color: var(--text-main); max-width: 900px; margin: 0 auto; line-height: 1.6; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--card-border); padding: 20px 24px; border-radius: 16px; }
    .status-badge { padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 24px; border-radius: 16px; }
    .card h3 { margin: 0; color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: uppercase; }
    .metric { font-size: 32px; font-weight: 800; margin: 10px 0 0 0; }
    .green { color: var(--accent-green); }
    .blue { color: var(--primary); }
    .purple { color: var(--accent-purple); }
    
    button.logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    
    /* Login view fallback */
    .login-box { background: #111827; border: 1px solid var(--card-border); padding: 32px; border-radius: 16px; max-width: 400px; margin: 60px auto; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; margin-bottom: 16px; background: #090d16; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; color: white; }
    .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 1. LOGIN FORM -->
  <div id="login-view" class="login-box" style="display: none;">
    <h2 style="margin-bottom: 8px;">Portal Sign In</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Enter your merchant credentials.</p>
    <form id="portal-form">
      <label>Email</label>
      <input type="email" id="p-email" required placeholder="merchant@example.com" />
      <label>Password</label>
      <input type="password" id="p-password" required placeholder="••••••••" />
      <button type="submit" class="btn-submit" id="p-btn">Sign In</button>
    </form>
    <p id="p-err" style="color: #f87171; font-size: 14px; margin-top: 12px; text-align: center;"></p>
  </div>

  <!-- 2. DASHBOARD VIEW -->
  <div id="dashboard-view" style="display: none;">
    <div class="header-bar">
      <div>
        <h1 id="store-name" style="font-size: 22px;">My Store</h1>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">
          Category: <strong id="store-category" style="color: #fff;">General</strong> &bull; <span class="status-badge" id="sync-status">Live Connected</span>
        </p>
      </div>
      <button class="logout" onclick="logout()">Sign Out</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 28px;">
      <h2 style="font-size: 18px;">Today's Live Sales</h2>
      <span id="display-date" style="color: var(--text-muted); font-size: 14px;"></span>
    </div>

    <div class="card-grid">
      <div class="card">
        <h3>Net Sales</h3>
        <p class="metric green" id="net-sales">₱0.00</p>
      </div>
      <div class="card">
        <h3>Transactions</h3>
        <p class="metric blue" id="tx-count">0</p>
      </div>
      <div class="card">
        <h3>Average Sale</h3>
        <p class="metric purple" id="avg-sale">₱0.00</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ezaqdnnecfkmqjdzigrf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6YXFkbm5lY2ZrbXFqZHppZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTE0NDEsImV4cCI6MjA5Mjk2NzQ0MX0.QoJryCMZwf_haqFZVr4LGaJqQR0Ux7yMyzvr2xLiJQE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeStore = null;

    function getLocalDate() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    }

    async function loadDashboard(user) {
      document.getElementById('login-view').style.display = 'none';

      const { data: store } = await supabaseClient
        .from('stores')
        .select('*')
        .or(`owner_id.eq.${user.id},user_id.eq.${user.id}`)
        .maybeSingle();

      if (!store) {
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('p-err').innerText = 'No store profile found for this account.';
        return;
      }

      activeStore = store;
      document.getElementById('store-name').innerText = store.name || 'My Store';
      document.getElementById('store-category').innerText = store.business_category || 'General';
      document.getElementById('display-date').innerText = `Date: ${getLocalDate()}`;
      document.getElementById('dashboard-view').style.display = 'block';

      const todayStr = getLocalDate();
      const symbol = store.currency_symbol || '₱';

      const { data: summary } = await supabaseClient
        .from('daily_sales_summaries')
        .select('*')
        .eq('store_id', store.id)
        .eq('date', todayStr)
        .maybeSingle();

      updateCards(summary || { net_sales: 0, transactions: 0, average_sale: 0 }, symbol);

      supabaseClient
        .channel(`portal-sales-sync-${store.id}`)
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'daily_sales_summaries',
          filter: `store_id=eq.${store.id}`
        }, (payload) => {
          if (payload.new && payload.new.date === getLocalDate()) {
            updateCards(payload.new, symbol);
          }
        })
        .subscribe();
    }

    function updateCards(data, symbol) {
      const net = Number(data.net_sales || 0);
      const tx = Number(data.transactions || 0);
      const avg = Number(data.average_sale || (tx > 0 ? net / tx : 0));

      document.getElementById('net-sales').innerText = `${symbol}${net.toFixed(2)}`;
      document.getElementById('tx-count').innerText = tx;
      document.getElementById('avg-sale').innerText = `${symbol}${avg.toFixed(2)}`;
    }

    document.getElementById('portal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('p-email').value.trim();
      const password = document.getElementById('p-password').value;
      document.getElementById('p-btn').innerText = 'Signing In...';
      document.getElementById('p-err').innerText = '';

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('p-err').innerText = error.message;
        document.getElementById('p-btn').innerText = 'Sign In';
      } else {
        loadDashboard(data.user);
      }
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      document.getElementById('dashboard-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'block';
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session?.user) {
        loadDashboard(session.user);
      } else {
        document.getElementById('login-view').style.display = 'block';
      }
    });
  </script>
</body>
</html>
